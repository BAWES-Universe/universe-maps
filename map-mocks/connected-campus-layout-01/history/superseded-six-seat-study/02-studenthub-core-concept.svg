"none" stroke="#e8b566" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="548.48" y="1018.35" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#17383d">FROM GIANT GATE</text><polyline points="828.1600000000001,484.56 963.4000000000001,484.56" fill="none" stroke="#b8dddf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="883.36" y="517.1700000000001" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#17383d">to quiet rooms</text><circle cx="195.20000000000002" cy="234.32" r="15" fill="#102b32" stroke="#e8b566" stroke-width="2"/><text x="195.20000000000002" y="238.09" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e8b566">1</text><circle cx="614.72" cy="550.8" r="15" fill="#102b32" stroke="#e8b566" stroke-width="2"/><text x="614.72" y="554.5699999999999" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e8b566">2</text><circle cx="239.36" cy="368.64" r="15" fill="#102b32" stroke="#e8b566" stroke-width="2"/><text x="239.36" y="372.40999999999997" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e8b566">3</text><circle cx="662.5600000000001" cy="258.24" r="15" fill="#102b32" stroke="#e8b566" stroke-width="2"/><text x="662.5600000000001" y="262.01" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e8b566">4</text><circle cx="239.36" cy="267.44" r="15" fill="#102b32" stroke="#e8b566" stroke-width="2"/><text x="239.36" y="271.21" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e8b566">5</text><circle cx="651.52" cy="469.84000000000003" r="15" fill="#102b32" stroke="#e8b566" stroke-width="2"/><text x="651.52" y="473.61" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e8b566">6</text><text x="1040" y="172.01" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#e8b566">ONE CONNECTED WORKPLACE</text><text x="1040" y="214.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#a9c4c4">The open floor, shared rug and continuous</text><text x="1040" y="240.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#a9c4c4">north wall keep the team visually together.</text><text x="1040" y="266.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#a9c4c4">Six everyday desks use the same workspace.</text><text x="1040" y="344.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#f3eee3">1  ROOM SHAPE SURVIVES REVEAL</text><text x="1040" y="377.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Outside: a real roof, clerestory and doorway.</text><text x="1040" y="402.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Inside: fade only opaque roof surfaces; keep</text><text x="1040" y="427.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">rim, columns, glazing and low side walls.</text><text x="1040" y="487.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#f3eee3">2  A REAL WELCOME THRESHOLD</text><text x="1040" y="520.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Reception sits beside the route, not across it.</text><text x="1040" y="545.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Spawn at (544, 448); door at (544, 512).</text><text x="1040" y="570.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Nearest desk approach: about 6 tile steps.</text><text x="1040" y="630.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#f3eee3">3  DAILY WORK = ONE SHARED CORE</text><text x="1040" y="663.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">576 × 352 px core envelope; glass meeting</text><text x="1040" y="688.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">room occupies its east edge. Furnished team</text><text x="1040" y="713.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">group stays within 432 × 200 px.</text><text x="1040" y="773.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#f3eee3">4  GLASS MEETING ROOM</text><text x="1040" y="806.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">160 × 192 px room, 128 px table, 4 seats.</text><text x="1040" y="831.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Glazing gives sightlines; actual call privacy</text><text x="1040" y="856.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">must be configured and tested separately.</text><text x="1040" y="916.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#f3eee3">5  TOOLS WITHOUT DEPARTMENT SILOS</text><text x="1040" y="949.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Lab bench; Ops / CRM dashboard; media +</text><text x="1040" y="974.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">design surface for Imagine, music and review.</text><text x="1040" y="999.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">They are shared stations, not live services.</text><text x="1040" y="1059.58" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#f3eee3">6  INFORMAL CONVERSATION</text><text x="1040" y="1092.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Small interior couch and rug off the aisle.</text><text x="1040" y="1117.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Larger outdoor lounge beside the fountain.</text><text x="1040" y="1142.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">No duplicate carpet islands on the main path.</text><text x="48" y="1155.39" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#e8b566">SCALE / CLEARANCE</text><text x="48" y="1193.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">32 px Woka • desk 64 × 32 px • chair 24 × 24 px • main route 96–128 px • clear chair pullback ≥ 32 px</text><text x="48" y="1218.77" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#a9c4c4">Native image and engine proof still need to validate sprite fit, diagonal passage, collisions, shadows and roof transitions.</text></svg>