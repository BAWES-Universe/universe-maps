<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riverside garden · native-scale preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e1d20;color:#eee8d9;font:14px system-ui,sans-serif}header{display:flex;gap:18px;align-items:center;padding:15px 20px;border-bottom:1px solid #31423b}h1{font:600 18px Georgia,serif;margin:0}p{margin:4px 0 0;color:#aebcb2;font-size:12px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button{font:inherit;border:1px solid #577260;background:#213b31;color:#f7ebd7;border-radius:7px;padding:8px 10px;cursor:pointer}button:hover{background:#355341}button[aria-pressed=true]{border-color:#ffd484;background:#634723}#stage{width:100%;height:calc(100vh - 150px);overflow:auto;display:flex;align-items:flex-start;justify-content:center;background:#0b171a}canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;image-rendering:auto;touch-action:none;outline:0}body.native canvas{max-width:none;max-height:none;width:1024px;height:1024px;flex-shrink:0}body.native #stage{justify-content:flex-start}footer{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;color:#c2cabb;font-size:12px;flex-wrap:wrap}.hint{color:#b7a88a}#status{min-width:180px}#audio{min-width:110px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;gap:9px;padding:10px}.tools{margin:0;gap:5px}button{padding:7px 8px;font-size:12px}#stage{height:calc(100vh - 200px)}footer{padding:8px 10px}}</style>
<header><div><h1>Riverside garden</h1><p>Visual + local interaction preview · Greg stays 32×32</p></div><div class="tools"><button id="zoom">Native 1×</button><button id="sound">Enable crackle</button><button id="motion" aria-pressed="false">Motion on</button><button id="debug">Footprints</button></div></header>
<div id="stage"><canvas id="map" width="1024" height="1024" tabindex="0" aria-label="Riverside garden walking preview"></canvas></div>
<footer><div><span id="status">Entering from the commons</span><div class="hint">Click a clear path or use WASD / arrows. E: bench spot / leave.</div></div><div class="tools" aria-label="Walk to a bench"><button data-bench="north">North bench</button><button data-bench="west">West bench</button><button data-bench="east">East bench</button><button data-bench="south">South bench</button></div><span id="audio">Sound off</span></footer>
<script type="module" src="./preview.mjs"></script></html>
